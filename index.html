<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareLink – Medical Center</title>
<style>
:root{--bg:#F3F7FF;--card:#fff;--ink:#172033;--mute:#64748B;--line:#E2E8F0;--pri:#2563EB;--tint:#E3ECFD;--ok:#16A34A;--okb:#DCF5E5;--wn:#B45309;--wnb:#FDEBCF;--er:#DC2626;--erb:#FCE0E0;--bar:rgba(255,255,255,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--card:#1C1C1E;--ink:#F2F5FA;--mute:#9AA7BA;--line:#2C2C2E;--pri:#5B93FF;--tint:#1B2D52;--ok:#4ADE80;--okb:#12341F;--wn:#FBBF24;--wnb:#40300F;--er:#F87171;--erb:#431B1B;--bar:rgba(28,28,30,.85)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1C1C1E;--ink:#F2F5FA;--mute:#9AA7BA;--line:#2C2C2E;--pri:#5B93FF;--tint:#1B2D52;--ok:#4ADE80;--okb:#12341F;--wn:#FBBF24;--wnb:#40300F;--er:#F87171;--erb:#431B1B;--bar:rgba(28,28,30,.85)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}[hidden]{display:none!important}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:0}
.ph{width:100%;height:100vh;position:relative;overflow:hidden;background:var(--bg)}
@media(min-width:520px){body{background:linear-gradient(135deg,#9db8f5,#e8eefc)}.w{padding:24px}.ph{width:390px;height:844px;border-radius:56px;border:11px solid #0b0b0d;box-shadow:0 30px 70px rgba(20,40,100,.4)}.ph:before{content:"";position:absolute;top:10px;left:50%;width:110px;height:30px;margin-left:-55px;background:#0b0b0d;border-radius:20px;z-index:20}.sc{padding-top:54px!important}}
.sc{position:absolute;inset:0;overflow:auto;padding:16px 16px 100px}
.tb{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:10}
.tb button{flex:1;background:none;border:0;padding:8px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);min-height:50px;cursor:pointer}.tb button[aria-current]{color:var(--pri);font-weight:700}
h1{font-size:28px;margin:6px 0 2px;letter-spacing:-.5px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);margin:20px 4px 8px}
.m{color:var(--mute);font-size:13px}.c{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);width:100%;text-align:left;box-shadow:0 2px 10px rgba(37,99,235,.07)}button.c{cursor:pointer}.c b{display:block}.c .m{display:block}
.ch{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--pri);white-space:nowrap;border:0}button.ch{cursor:pointer;min-height:32px}.ch.g{background:var(--okb);color:var(--ok)}.ch.o{background:var(--wnb);color:var(--wn)}.ch.r{background:var(--erb);color:var(--er)}
.bt{display:block;width:100%;height:52px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:16px;margin-top:12px;cursor:pointer}.bt.s{background:var(--tint);color:var(--pri)}.bt.d{background:var(--erb);color:var(--er)}.bt:disabled{opacity:.45}
.nb{display:flex;margin:-4px 0 4px}.nb button{background:none;border:0;color:var(--pri);font-size:16px;display:flex;align-items:center;cursor:pointer;min-height:44px;padding:0}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;margin:8px 0}.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 2px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.row{display:flex;gap:8px;flex-wrap:wrap}.fl{display:block;width:100%;height:52px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;margin-top:10px}textarea.fl{height:84px;padding:12px}
.sl{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;text-align:center;font-weight:600;cursor:pointer;flex:1 1 28%;min-height:44px}.sl[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}.sl:disabled{opacity:.4;cursor:not-allowed}.sl small{display:block;font-size:10px;font-weight:500}.sl.dt{flex:1 1 0;min-width:0;padding:8px 0}
.up{background:linear-gradient(145deg,var(--tint),var(--card));border-radius:20px;padding:16px;margin-top:14px;border:1px solid var(--line)}
.tile{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}.ti{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--pri);display:flex;align-items:center;justify-content:center}
.bell{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--pri);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.toast{position:absolute;left:16px;right:16px;top:60px;background:#172033;color:#fff;padding:12px 14px;border-radius:14px;z-index:30;font-size:14px}
.net{background:var(--wnb);color:var(--wn);text-align:center;padding:8px;border-radius:10px;font-weight:600;font-size:13px;margin:10px 0}
.sw{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]:after{left:22px}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;margin:20px auto 8px;animation:sp 1s linear infinite}.gc{background:var(--tint);color:var(--pri);font-weight:800;font-size:34px;border-radius:20px;padding:26px;margin:16px 0;text-align:center}.cf{position:absolute;width:8px;height:8px;border-radius:2px}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pb{from{width:0}to{width:100%}}
</style></head><body>
<div class="w"><div class="ph" id="ph"><div class="sc" id="sc"></div><nav class="tb" id="tb" aria-label="Main" hidden></nav></div></div>
<script>
const $=s=>document.querySelector(s);
const TM=['09:00','09:30','10:00','10:30','11:00','11:30','13:00','13:30','14:00','14:30','15:00','15:30'];
const iso=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const lbl=s=>{const o=Math.round((new Date(s+'T00:00')-new Date(iso(0)+'T00:00'))/864e5);return o==0?'Today':o==1?'Tomorrow':new Date(s+'T00:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'})};
const tf=t=>{const h=+t.slice(0,2);return (h%12||12)+t.slice(2)+(h<12?' AM':' PM')};
let ME='Juan Dela Cruz',DOC='d1';const HOSP='CareLink Medical Center',CFG={ap:0,cx:24},ROLE={p:'user',d:'doctor',s:'admin'},ACC=[{u:'juan',p:'user123',r:'p',n:'Juan Dela Cruz'},{u:'maria',p:'user123',r:'p',n:'Maria Lopez'},{u:'dr.santos',p:'doctor123',r:'d',d:'d1'},{u:'dr.reyes',p:'doctor123',r:'d',d:'d2'},{u:'admin',p:'admin123',r:'s'}],PERMS={p:['book'],d:['schedule','complete'],s:['approve','checkin','walkin','config']},can=x=>PERMS[S.role].includes(x);
const DR=[{id:'d1',n:'Dr. Maria Santos',sp:'General Physician',fee:800,rt:'4.8',yrs:12,sh:'full',lim:10},{id:'d2',n:'Dr. James Reyes',sp:'Cardiologist',fee:1000,rt:'4.7',yrs:15,sh:'am',lim:8},{id:'d3',n:'Dr. Ana Garcia',sp:'Pediatrician',fee:800,rt:'4.9',yrs:9,sh:'full',lim:10},{id:'d4',n:'Dr. Paolo Lim',sp:'Dermatologist',fee:850,rt:'4.6',yrs:8,sh:'pm',lim:8}];
const dr=id=>DR.find(d=>d.id==id),key=(d,dt,t)=>d+'|'+dt+'|'+t;
const mkA=(ref,p,d,dt,t,st)=>({ref,p,d,dt,t,vt:'In-person',why:'Consultation',st,fee:dr(d).fee,pay:'Paid'});
let A=[mkA('CL-4F2K9','Jordan Pe\u00f1a','d1',iso(0),'09:00','Confirmed'),mkA('CL-7H3M2','Ana Reyes','d1',iso(0),'10:30','Pending'),mkA('CL-2B8Q1','Carlo Mendoza','d2',iso(1),'09:30','Confirmed')],B={},BL={},HD={},LOG=[],REC=[];
A.forEach(a=>B[key(a.d,a.dt,a.t)]=a.ref);HD[key('d3',iso(0),'09:30')]={until:Date.now()+18e4,by:'x'};
const S={role:null,tab:0,st:[],ob:'login',splash:1,sp:'All',q:'',seg:0,docSeg:0,date:iso(0),time:null,vt:'In-person',pay:'',why:'',did:null,sel:null,hold:null,off:0,sd:iso(0),lr:'p',phone:'',phoneVerified:false,otpCode:'',demoOtp:false,otpFlow:'signup',lastCreatedDoctor:null,mhAppointment:null};
const offered=d=>d.sh=='am'?TM.slice(0,6):d.sh=='pm'?TM.slice(6):TM;
const cnt=(d,dt)=>A.filter(a=>a.d==d&&a.dt==dt&&!['Cancelled','No-show'].includes(a.st)).length;
const ss=(d,dt,t)=>{const k=key(d,dt,t);return B[k]?'Booked':BL[k]?'Blocked':(HD[k]&&HD[k].until>Date.now()&&HD[k].by!='me')?'Held':cnt(d,dt)>=dr(d).lim?'Full':'free'};
const nextAv=d=>{for(let o=0;o<7;o++)for(const t of offered(d))if(ss(d.id,iso(o),t)=='free')return lbl(iso(o))+' '+tf(t);return 'None this week'};
const log=m=>LOG.unshift(new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})+' \u00b7 '+m);
const mine=()=>A.filter(a=>a.p==ME),hrs=a=>(new Date(a.dt+'T'+a.t)-Date.now())/36e5,ok=a=>a.st=='Pending'||hrs(a)>=CFG.cx;
const rel=()=>{if(S.hold){delete HD[S.hold];S.hold=null}};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;$('#ph').appendChild(t);setTimeout(()=>t.remove(),2800)};
const IC={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',cal:'M4 5h16v16H4zM4 10h16M8 3v4M16 3v4',doc:'M6 3h9l4 4v14H6zM9 12h7M9 16h7',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6',qr:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3h-3zM19 19h1',users:'M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2 20c0-3 3-5 7-5s7 2 7 5M17 5a3.5 3.5 0 010 6',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',clock:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2',back:'M15 5l-7 7 7 7',check:'M5 12l5 5 9-10',mail:'M3 6h18v12H3zM3 7l9 7 9-7',lock:'M6 11h12v10H6zM8 11V8a4 4 0 018 0v3',bell:'M6 17v-6a6 6 0 1112 0v6l2 2H4zM10 21h4',phone:'M7 3h3l2 5-2 1a11 11 0 005 5l1-2 5 2v3a2 2 0 01-2 2A16 16 0 015 5a2 2 0 012-2z',steth:'M6 3v6a4 4 0 008 0V3M10 13v3a4 4 0 008 0v-2M18 12a2 2 0 100-4 2 2 0 000 4z',shield:'M12 3l8 3v6c0 5-3 8-8 9-5-1-8-4-8-9V6z'};
const I=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="1.5" width="8" height="21" rx="2.5" fill="#2563EB"/><rect x="1.5" y="8" width="21" height="8" rx="2.5" fill="#2563EB"/><path d="M5 12h3.5l1.5-3 3 6 1.5-3H19" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const av=(d,s=44)=>`<span style="width:${s}px;height:${s}px;border-radius:50%;background:var(--tint);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none">${d.n.replace('Dr. ','').split(' ').map(x=>x[0]).join('')}</span>`;
const ch=(t,c='')=>`<span class="ch ${c}">${t}</span>`,SC={Pending:'o',Confirmed:'','Checked In':'g',Completed:'g',Cancelled:'r','No-show':'r'},st=a=>ch(a.st,SC[a.st]);
const nbk=t=>`<div class="nb"><button data-a="back" aria-label="Back">${I('back',22)}Back</button></div><h1>${t}</h1>`;
const fd=(ic,ph,id,v='',ty='text')=>`<label class="fl" style="display:flex;align-items:center;gap:10px"><span style="color:var(--pri)">${I(ic,20)}</span><input id="${id}" type="${ty}" value="${v}" placeholder="${ph}" aria-label="${ph}" style="flex:1;border:0;background:none;outline:none;min-width:0;height:48px"></label>`;
const sw=(a,v,on,l)=>`<button class="sw" role="switch" aria-label="${l}" aria-checked="${!!on}" data-a="${a}" data-v="${v}"></button>`;
const seg=(a,items,cur)=>`<div class="seg">${items.map(([v,t])=>`<button data-a="${a}" data-v="${v}" aria-pressed="${cur==v}">${t}</button>`).join('')}</div>`;
function qr(ref){let h=0,o='';for(const c of ref)h=(h*31+c.charCodeAt(0))>>>0;for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on;if(f){const a=x<7?x:x-14,b=y<7?y:y-14;on=a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5)}else{h=(h*1664525+1013904223)>>>0;on=h>>>29>2}if(on)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="-1 -1 23 23" width="160" height="160" style="background:#fff;border-radius:12px;padding:6px;color:#000" role="img" aria-label="QR code ${ref}">${o}</svg>`}
const TB={p:[['Home','home'],['Book an Appointment','calendar-plus'],['Appointment History','calendar-clock'],['Profile','user']],d:[['Schedule','clock'],['My Appointments','cal'],['Account','user']],s:[['Dashboard','chart'],['Appointments','cal'],['Check-in','qr'],['Doctors','steth'],['Account','user']]};
const FOCUS=['slot','visit','sum','pay','done','contact','phoneotp'],V={};
const ob=(t,sub,body,btn,nx,bk)=>`<div class="nb"><button data-a="ob" data-v="${bk}" aria-label="Back">${I('back',22)}</button></div><h1 style="text-align:center">${t}</h1><p class="m" style="text-align:center">${sub}</p>${body}<button class="bt" data-a="ob" data-v="${nx}">${btn}</button>`;
V.splash=()=>`<div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:150px">${logo(92)}<h1 style="color:var(--pri);margin-top:12px">CareLink</h1><p class="m">Hospital Appointment<br>Booking System</p><div style="margin-top:40px;width:120px;height:4px;background:var(--line);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;background:var(--pri);animation:pb 2.1s linear"></i></div><p class="m" style="margin-top:60px">Your Health. Our Priority.</p></div>`;
V.login=()=>`<div style="text-align:center;padding-top:20px">${logo(54)}<h1>CareLink</h1><b>Welcome Back!</b><p class="m">${HOSP}</p></div>${seg('role',[['p','Patient'],['d','Doctor'],['s','Staff']],S.lr)}${fd('mail','Email or mobile number','em','juan@example.com')}${fd('lock','Password','pw','password','password')}<div class="row" style="justify-content:space-between;margin-top:10px"><label class="m"><input type="checkbox" checked> Remember me</label><span class="m" style="color:var(--pri)">Forgot password?</span></div><button class="bt" data-a="login">Log in</button><p class="m" style="text-align:center;margin-top:14px">Don\u2019t have an account? <button data-a="ob" data-v="signup" style="background:none;border:0;color:var(--pri);font-weight:700;cursor:pointer;min-height:44px">Sign Up</button></p><p class="m" style="text-align:center">Doctor and staff accounts are issued by the hospital.</p>`;
V.signup=()=>ob('Create Account','Enter a valid Philippine mobile number to verify your account.',fd('phone','09XXXXXXXXX or +639XXXXXXXXX','mb',S.phone,'tel')+fd('mail','Email address','ea'),'Send OTP','otp','login');
V.otp=()=>ob('Confirm Phone Number',`Enter the 6-digit code for ${S.phone}.`,`${S.demoOtp?`<div class="net">Demo OTP: <b>${S.otpCode}</b> (SMS sending is not connected in this prototype.)</div>`:''}<div class="row" style="flex-wrap:nowrap;justify-content:space-between;margin:20px 0">${[1,2,3,4,5,6].map(i=>`<input class="fl otp-digit" style="width:46px;height:52px;padding:0;text-align:center;margin:0" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit ${i}">`).join('')}</div><button class="ch" type="button" data-a="resendotp">Resend code</button>`,'Verify','info','signup');
V.info=()=>ob('Personal Information','Tell us about yourself.',fd('user','Full name','fn')+`<input class="fl" type="date" aria-label="Date of birth"><input class="fl" placeholder="Allergies and conditions (optional)" aria-label="Medical history">`,'Finish','done0','otp');
V.contact=()=>nbk('Patient Contact')+`<p class="m">A verified mobile number is required before you can book an appointment. Enter your own active Philippine mobile number.</p><h2>Mobile number</h2>${fd('phone','09XXXXXXXXX or +639XXXXXXXXX','contactPhone',S.phone,'tel')}<div class="c" style="display:block"><b>Verification status</b><span class="m">${S.phoneVerified?'This number is verified.':'Not verified. You cannot book until OTP verification is complete.'}</span></div><button class="bt" data-a="sendcontactotp">${S.phoneVerified?'Verify a different number':'Send OTP'}</button>`;
V.phoneotp=()=>nbk('Verify Mobile Number')+`<p class="m">Enter the 6-digit OTP for <b>${S.phone}</b>.</p>${S.demoOtp?`<div class="net">Demo OTP: <b>${S.otpCode}</b> (real SMS delivery is not connected in this prototype.)</div>`:''}<div class="row" style="flex-wrap:nowrap;justify-content:space-between;margin:20px 0">${[1,2,3,4,5,6].map(i=>`<input class="fl otp-digit" style="width:46px;height:52px;padding:0;text-align:center;margin:0" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit ${i}">`).join('')}</div><div class="row"><button class="ch" data-a="resendcontactotp">Resend OTP</button><button class="ch" data-a="back">Change number</button></div><button class="bt" data-a="verifycontactotp">Verify phone number</button>`;
V.p0=()=>{const n=mine().find(a=>['Confirmed','Pending'].includes(a.st)),t=(i,l,a,v)=>`<button class="tile" data-a="${a}" data-v="${v}"><span class="ti">${I(i)}</span>${l}</button>`;
return `${S.off?'<div class="net">You\u2019re offline. Showing saved data.</div>':''}<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><h1>Hello, ${ME.split(' ')[0]}!</h1><p class="m">Take care. Stay healthy!</p></div><button class="bell" data-a="go" data-v="notif" aria-label="Notifications">${I('bell',22)}</button></div><div class="up">${n?`<b style="color:var(--pri)">Upcoming Appointment</b><p style="margin:6px 0 0;font-weight:700">${lbl(n.dt)} \u00b7 ${tf(n.t)}</p><p class="m" style="margin:0">${dr(n.d).n} \u00b7 ${dr(n.d).sp}</p><button class="bt" style="width:auto;height:40px;padding:0 18px" data-a="det" data-v="${n.ref}">View Details \u2192</button>`:`<b>No upcoming appointment</b><p class="m">Find a doctor to book.</p>`}</div><button class="bt" style="margin-top:14px" data-a="go" data-v="docs">Book an Appointment</button><div class="row" style="justify-content:space-between;margin:18px 4px 8px"><b>Recommended Doctors</b><button data-a="go" data-v="docs" style="background:none;border:0;color:var(--pri);cursor:pointer;min-height:36px">See All</button></div>${DR.slice(0,3).map(dc).join('')}`};
const dc=d=>`<button class="c" data-a="dp" data-v="${d.id}"><div class="row" style="flex-wrap:nowrap;align-items:center">${av(d)}<div><b>${d.n}</b><span class="m">${d.sp} \u00b7 \u2605 ${d.rt}</span></div></div><b style="color:var(--pri)">\u20b1${d.fee}</b></button>`;
const dl=()=>{const q=S.q.toLowerCase(),L=DR.filter(d=>(S.sp=='All'||d.sp==S.sp)&&(d.n+d.sp).toLowerCase().includes(q));return L.length?L.map(d=>`<button class="c" data-a="dp" data-v="${d.id}"><div class="row" style="flex-wrap:nowrap;align-items:center">${av(d)}<div><b>${d.n}</b><span class="m">${d.sp} \u00b7 \u2605 ${d.rt}<br>Next: ${nextAv(d)}</span></div></div><b style="color:var(--pri)">\u20b1${d.fee}</b></button>`).join(''):'<p class="m">No doctor matches.</p>'};
